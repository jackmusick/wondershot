name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to package
        required: true
        type: string
      installers_run_id:
        description: Successful installer build run to reuse
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build_installers:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish_installers:
    if: github.event_name == 'push'
    needs: build_installers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: wondershot-*-installers

      - name: Create draft release with platform installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o \
            -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.tar.gz' \
          \) -print)
          test "${#assets[@]}" -gt 0 || { echo 'No installer artifacts were downloaded'; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Wondershot $TAG" \
              --notes 'Unsigned platform installers for Linux, Windows, and macOS.' \
              --draft --prerelease
          fi

  flatpak:
    if: always() && (github.event_name == 'workflow_dispatch' || needs.publish_installers.result == 'success')
    needs: publish_installers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify installer provenance for packaging retry
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.installers_run_id }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          source_sha=$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          test "$source_sha" = "$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("build_installers / tauri")) | .conclusion] | length == 3 and all(. == "success")' \
            | grep -qx true

      - uses: actions/download-artifact@v4
        with:
          name: wondershot-linux-installers
          path: dist/linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.installers_run_id || github.run_id }}

      - name: Import Flatpak signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$FLATPAK_GPG_PRIVATE_KEY"
          export GNUPGHOME="$RUNNER_TEMP/flatpak-gnupg"
          mkdir -m700 "$GNUPGHOME"
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --show-keys --with-colons packaging/flatpak/repository-key.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          test -n "$key"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_KEY=$key" >> "$GITHUB_ENV"

      - name: Build and attach Flatpak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream-compose
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//49 org.gnome.Sdk//49

          deb=$(find dist/linux -type f -iname 'wondershot_*_amd64.deb' | head -n1)
          test -n "$deb" || { echo 'No Linux deb installer was downloaded'; exit 1; }
          cp "$deb" packaging/flatpak/wondershot.deb
          python3 - <<'PYMETA'
          import datetime, json, os, xml.etree.ElementTree as ET
          version = json.load(open('src-tauri/tauri.conf.json'))['version']
          assert os.environ['TAG'] == f'v{version}', 'Release tag must match app version'
          path = 'packaging/flatpak/io.github.jackmusick.wondershot.metainfo.xml'
          tree = ET.parse(path)
          release = tree.find('./releases/release')
          release.set('version', version)
          release.set('date', datetime.date.today().isoformat())
          tree.write(path, encoding='UTF-8', xml_declaration=True)
          PYMETA

          # Fetch separately so transient network failures can be retried without
          # discarding compiled modules or rerunning platform installer builds.
          for attempt in 1 2 3; do
            flatpak-builder --user --download-only fp-build \
              packaging/flatpak/io.github.jackmusick.wondershot.yml && break
            test "$attempt" -lt 3 || exit 1
            sleep 5
          done
          flatpak-builder --user --force-clean --repo=fp-site/repo \
            --gpg-sign="$FLATPAK_GPG_KEY" \
            fp-build packaging/flatpak/io.github.jackmusick.wondershot.yml
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY" \
            --generate-static-deltas --prune fp-site/repo
          gpg --export "$FLATPAK_GPG_KEY" > "$RUNNER_TEMP/flatpak-public.gpg"
          python3 scripts/flatpak-repository.py fp-site \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" \
            "$RUNNER_TEMP/flatpak-public.gpg"
          flatpak build-bundle \
            --repo-url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/repo" \
            --gpg-keys="$RUNNER_TEMP/flatpak-public.gpg" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            fp-site/repo wondershot.flatpak io.github.jackmusick.wondershot stable

          flatpak install --user -y --noninteractive wondershot.flatpak
          flatpak run io.github.jackmusick.wondershot --self-check \
            | grep -q '^wondershot self check '
          # Exercise signed summary + appstream, rather than only a detached bundle.
          flatpak remote-add --user --gpg-import="$RUNNER_TEMP/flatpak-public.gpg" \
            wondershot-test "file://$PWD/fp-site/repo"
          flatpak remote-ls --user wondershot-test | grep io.github.jackmusick.wondershot
          flatpak install --user -y --noninteractive --reinstall wondershot-test \
            io.github.jackmusick.wondershot//stable
          flatpak run io.github.jackmusick.wondershot --self-check \
            | grep -q '^wondershot self check '
          tar -czf flatpak-repository.tar.gz -C fp-site .
          gh release upload "$TAG" wondershot.flatpak flatpak-repository.tar.gz \
            fp-site/wondershot.flatpakref fp-site/wondershot.flatpakrepo \
            --repo "$GITHUB_REPOSITORY" --clobber
