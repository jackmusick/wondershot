name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_installers:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish_installers:
    needs: build_installers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release with platform installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o \
            -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.tar.gz' \
          \) -print)
          test "${#assets[@]}" -gt 0 || { echo 'No installer artifacts were downloaded'; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Wondershot $TAG" \
              --notes 'Unsigned platform installers for Linux, Windows, and macOS.' \
              --draft --prerelease
          fi

  flatpak:
    needs: publish_installers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wondershot-linux-installers
          path: dist/linux

      - name: Build and attach Flatpak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//49 org.gnome.Sdk//49

          deb=$(find dist/linux -type f -iname 'wondershot_*_amd64.deb' | head -n1)
          test -n "$deb" || { echo 'No Linux deb installer was downloaded'; exit 1; }
          cp "$deb" packaging/flatpak/wondershot.deb

          flatpak-builder --user --force-clean --repo=fp-repo \
            fp-build packaging/flatpak/io.github.jackmusick.wondershot.yml
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            fp-repo wondershot.flatpak io.github.jackmusick.wondershot

          flatpak install --user -y --noninteractive wondershot.flatpak
          flatpak run io.github.jackmusick.wondershot --self-check \
            | grep -q '^wondershot self check '
          gh release upload "$TAG" wondershot.flatpak --repo "$GITHUB_REPOSITORY" --clobber
