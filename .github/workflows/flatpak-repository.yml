name: Publish Flatpak repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flatpak-repository
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-22.04
    steps:
      - name: Download signed repository from stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          test "$TAG" = "$latest" || { echo 'Only the latest stable release may update the repository'; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern flatpak-repository.tar.gz
          mkdir site
          tar -xzf flatpak-repository.tar.gz -C site
          test -s site/repo/summary.sig
          test -s site/wondershot.flatpakref

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
