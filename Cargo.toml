[workspace]
members = ["src-tauri", "crates/wondershot-core", "crates/wondershot-selector"]
resolver = "2"

# Smaller, faster release binaries for everything in the workspace: thin LTO +
# one codegen unit shrink the Tauri/gst dependency graph meaningfully; symbols
# are stripped at link time (the deb was shipping a 25 MB binary).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Native overlays process full Retina frames. Keep their pixel loops optimized
# even in the debug app used for local macOS builds.
[profile.dev.package.wondershot-selector]
opt-level = 2

[profile.dev.package.wondershot-core]
opt-level = 2

[profile.dev.package.image]
opt-level = 2
